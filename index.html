<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Aula de Aprendizaje en Investigación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..700&family=Mulish:wght@400..800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#FAFCFA;--paper-2:#EEF3EF;--ink:#10201A;--ink-2:#33473E;--muted:#5E706A;--node:#076633;--spine:#A9C2B3;--ember:#9C5A26;
  --rule:#C9D8CF;--rule-soft:#E4ECE7;--canvas:#FFFFFF;--sh:0 1px 2px rgba(16,32,26,.06),0 10px 28px rgba(16,32,26,.08);
  --f-display:"EB Garamond","Adobe Garamond Pro",Garamond,Georgia,serif;
  --f-body:"Mulish","Avenir Next",Avenir,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color-scheme:light}
[data-p="0"]{--acc:#076633;--acc-soft:#E6F2EA}
[data-p="1"]{--acc:#0B6B7A;--acc-soft:#E2F1F3}
[data-p="2"]{--acc:#4A55A2;--acc-soft:#E8EAF6}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;overflow:hidden;background:#FFFFFF}
body{height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,p,dl,dd,ul{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
a{color:var(--node)}
.bar{flex:none;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule-soft)}
.bar-in{padding:.6rem 20px;display:flex;align-items:center;gap:.6rem 1.5rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem;margin-right:auto;min-width:0}
.brand img{height:24px;width:auto;display:block}
.vr{flex:none;width:1px;height:26px;background:var(--rule)}
.brand b{display:block;font:600 1.02rem/1.15 var(--f-display)}
.brand small{display:block;font-size:.72rem;color:var(--muted)}
.filters{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.45rem;font:600 .8rem var(--f-body);padding:.4rem .8rem;border-radius:999px;border:1.5px solid var(--rule);background:#fff;color:var(--ink-2);cursor:pointer}
.chip b{font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--node);background:var(--paper-2);color:var(--ink)}
.dot{flex:none;display:inline-block;width:10px;height:10px;border-radius:50%;margin-top:.4rem}
.dot.c{background:var(--node)}
.dot.p{border:2px solid var(--ember)}
.chip .dot{margin:0;width:9px;height:9px}

.wrap{position:relative;flex:1;min-height:0}
.vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--canvas)}
.vp.grab{cursor:grabbing;user-select:none}
#board{position:absolute;left:0;top:0;transform-origin:0 0}
.stage{position:relative;width:1640px;padding-bottom:40px}
.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.links{transition:opacity .35s}.links line{stroke-width:1.8}
.root{padding-top:48px;margin-bottom:110px}
.stage[data-v="n"] .root{margin-bottom:64px}
.rootoval{width:780px;margin:0 auto;text-align:center;background:#fff;border:2px solid var(--node);border-radius:50%;padding:48px 88px;box-shadow:var(--sh)}
h1{font:500 3.3rem/1.05 var(--f-display);letter-spacing:-.015em;max-width:14ch;margin:0 auto;text-wrap:balance}
.rootoval p{max-width:34ch;margin:.9rem auto 0;color:var(--ink-2);font-size:.92rem;line-height:1.5}

.cols{display:grid;gap:90px;align-items:start}
.proc{min-width:0}
.pnode,.mx-r{min-height:100px;display:flex;flex-direction:column;justify-content:center;text-align:center;background:var(--acc);color:#fff;border-radius:20px;padding:1rem 1.2rem;box-shadow:var(--sh);font:600 1.6rem/1.15 var(--f-display)}
.pnode small,.mx-r small{margin-top:.3rem;font:500 .8rem var(--f-body);opacity:.9}
.subrow{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px;margin-top:64px}
.oval{font:inherit;color:var(--ink);cursor:pointer;border:1.5px solid var(--acc);border-radius:50%;background:#fff;min-height:104px;padding:12px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.15rem;box-shadow:0 1px 2px rgba(16,32,26,.06)}
.oval:hover{background:var(--acc-soft)}
.oval .on{font:600 1.06rem/1.15 var(--f-display);overflow-wrap:break-word;max-width:100%}
.oval .oc{font:600 .7rem var(--f-body);color:var(--muted)}
.oval[aria-expanded="true"]{background:var(--acc);color:#fff;box-shadow:var(--sh)}
.oval[aria-expanded="true"] .oc{color:#fff;opacity:.9}
.panel{margin-top:64px}
.empty{padding:.5rem 1rem;color:var(--muted);font-size:.88rem}
.leaves{list-style:none;padding:0;display:grid;gap:8px}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.leaf>details>summary{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem 1.35rem;border:1.5px solid var(--acc);border-radius:999px;background:#fff;font-size:.88rem;line-height:1.35;overflow-wrap:break-word;box-shadow:0 1px 1px rgba(16,32,26,.04)}
.leaf>details>summary>span{min-width:0}
.leaf small{display:block;margin-top:.1rem;color:var(--muted);font-size:.72rem;font-weight:600}
.leaf>details>summary:hover{background:var(--acc-soft)}
.leaf>details[open]>summary{background:var(--acc-soft);font-weight:700}
.ficha{margin:6px 6px 6px 20px;padding:12px 14px;background:#fff;border:1px solid var(--rule-soft);border-left:3px solid var(--acc);border-radius:4px 14px 14px 4px;box-shadow:0 1px 2px rgba(16,32,26,.05),0 6px 16px rgba(16,32,26,.06);font-size:.88rem;line-height:1.5;cursor:auto}
.desc{margin-bottom:.6rem;color:var(--ink-2)}
.desc.b{font-weight:700;color:var(--ink)}
.desc strong{color:var(--ink)}
.ficha dl{display:grid;gap:.55rem;margin-top:.75rem}
.ficha dl>div{display:grid;grid-template-columns:6.2rem minmax(0,1fr);gap:.6rem}
.ficha dt{color:var(--muted);font-weight:700;font-size:.8rem;padding-top:.1rem}
.ficha dd.none{color:var(--muted);font-style:italic}
.ficha dd.st{display:flex;align-items:center;gap:.5rem}
.ficha dd.st .dot{margin:0}

.mx{display:grid;grid-template-columns:200px repeat(3,minmax(0,1fr));gap:52px 22px;align-items:start}
.mx-h{display:flex;align-items:center;gap:.9rem;background:#fff;border:1.5px solid var(--rule);border-radius:999px;padding:.9rem 1.6rem;box-shadow:var(--sh)}
.mx-h b{font:600 1.7rem/1 var(--f-display)}
.mx-h small{margin-left:auto;font-size:.78rem;font-weight:600;color:var(--muted)}
.bars{display:inline-flex;align-items:flex-end;gap:3px}
.bars i{width:5px;border-radius:2px;background:var(--rule)}
.bars i:nth-child(1){height:10px}.bars i:nth-child(2){height:15px}.bars i:nth-child(3){height:20px}
.bars i.on{background:var(--node)}
.mx-r{text-align:left;font-size:1.4rem}
.mx-c{min-width:0}
.ghosts{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:5}.ghosts>*{position:absolute;margin:0;list-style:none}
.stage.ghosting .leaf,.stage.ghosting .pnode,.stage.ghosting .mx-r,.stage.ghosting .mx-h,.stage.ghosting .oval{visibility:hidden}

.dock,.zoom{position:absolute;bottom:22px;z-index:10;display:flex;align-items:center;background:rgba(255,255,255,.88);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(16,32,26,.08);box-shadow:0 10px 34px rgba(16,32,26,.16);border-radius:999px;padding:5px}
.dock{left:50%;transform:translateX(-50%);gap:4px}
.zoom{right:20px;gap:2px}
.seg,.zb{font:700 .9rem var(--f-body);border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-radius:999px}
.seg{padding:.65rem 1.5rem}
.seg[aria-pressed="true"]{background:var(--node);color:#fff}
.zb{min-width:36px;height:36px;padding:0 .7rem;font-size:1.1rem}
.zb:hover{background:var(--paper-2)}
.zb.t{font-size:.8rem}
#zl{min-width:3.2rem;text-align:center;font:700 .8rem var(--f-body);color:var(--muted)}
.hint{position:absolute;left:20px;bottom:30px;font-size:.75rem;color:var(--muted);pointer-events:none}
@media (pointer:coarse),(max-width:760px){.hint{display:none}}
@media (max-width:640px){.zoom{right:12px;bottom:84px}.bar-in{padding:.5rem 14px}}
</style>
</head>

let _n=0;DATA.forEach(p=>p.subs.forEach(s=>s.items.forEach(i=>{i.id=_n++})));const LV=[['J','Junior'],['A','Asociado'],['S','Senior']],LN={J:'Junior',A:'Asociado',S:'Senior'};

function show(){
  $$('.proc').forEach((sec,pi)=>{
    $$('.oval',sec).forEach((b,si)=>b.setAttribute('aria-expanded',String(state[pi]===si)));

function apply(f){
  $$('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f===f)));

    $('small',sec).textContent=t;$('.mx-r[data-p="'+pi+'"] small').textContent=t;
    $$('.panel',sec).forEach((pan,si)=>{const q=$$('.leaf',pan),n=q.filter(l=>!l.hidden).length;
      $('.empty',pan).hidden=n>0;$('.oc',$$('.oval',sec)[si]).textContent=f==='all'?plural(q.length):n+' de '+plural(q.length)});
  });
  $$('.mx-c').forEach(c=>$('.empty',c).hidden=$$('.leaf:not([hidden])',c).length>0);

const cnt={all:$$('#view-p .leaf').length,c:$$('#view-p .leaf[data-st="c"]').length,p:$$('#view-p .leaf[data-st="p"]').length};
[['all','Todas'],['c','Constituidas'],['p','Proyectadas']].forEach(([k,t])=>{
  const b=el('button','chip');b.type='button';b.dataset.f=k;
  if(k!=='all')b.append(el('i','dot '+k));
  b.append(t+' ',el('b',null,cnt[k]));b.onclick=()=>apply(k);$('#filters').append(b);
});

/* flechas del mapa (vista Procesos) */
function mk(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e}
function draw(){
  if(busy)return;svg.replaceChildren();if(view!=='p')return;
  const S=stage.getBoundingClientRect();
  const P=e=>{const r=e.getBoundingClientRect();return{l:(r.left-S.left)/Z,r:(r.right-S.left)/Z,t:(r.top-S.top)/Z,b:(r.bottom-S.top)/Z,cx:(r.left-S.left+r.width/2)/Z}};
  svg.setAttribute('width',stage.offsetWidth);svg.setAttribute('height',stage.offsetHeight);
  const secs=$$('.proc'),col=secs.map(s=>getComputedStyle(s).getPropertyValue('--acc').trim()),df=mk('defs',{});
  col.forEach((c,i)=>{const m=mk('marker',{id:'ah'+i,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'8',markerHeight:'8',orient:'auto'});m.append(mk('path',{d:'M0 0L10 5L0 10z',fill:c}));df.append(m)});
  svg.append(df);
  const ln=(x1,y1,x2,y2,i)=>svg.append(mk('line',{x1,y1,x2,y2,stroke:col[i],'marker-end':'url(#ah'+i+')'}));
  const R=P($('.rootoval')),a=(R.r-R.l)/2,b=(R.b-R.t)/2,cy=R.t+b;
  secs.forEach((sec,pi)=>{
    const pb=P($('.pnode',sec)),th=(secs.length>1?140-pi*100/(secs.length-1):90)*Math.PI/180,c=Math.cos(th),s=Math.sin(th);
    let nx=c/a,ny=s/b;const k=Math.hypot(nx,ny);nx/=k;ny/=k;
    ln(R.cx+a*c+nx*7,cy+b*s+ny*7,pb.cx,pb.t-3,pi);
    $$('.oval',sec).forEach((o,si)=>{
      const r=P(o);ln(r.cx,pb.b+2,r.cx,r.t-3,pi);
      const pan=$$('.panel',sec)[si];
      if(state[pi]===si&&pan&&!pan.hidden)ln(r.cx,r.b+2,r.cx,P(pan).t-3,pi);
    });
  });
}
function redraw(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}

/* tablero: mover y hacer zoom */
function place(){
  const w=stage.offsetWidth*Z,h=stage.offsetHeight*Z,vw=vp.clientWidth,vh=vp.clientHeight,m=Math.min(vw,vh)*.2;
  X=Math.min(vw-m,Math.max(m-w,X));Y=Math.min(vh-m,Math.max(m-h,Y));
  board.style.transform='translate('+X+'px,'+Y+'px) scale('+Z+')';
  
  zl.textContent=Math.round(Z*100)+'%';
}
function zoomAt(f,cx,cy){const nz=Math.min(2.5,Math.max(.2,Z*f)),k=nz/Z;X=cx-(cx-X)*k;Y=cy-(cy-Y)*k;Z=nz;place()}
function fit(){
  const w=stage.offsetWidth,vw=vp.clientWidth;if(!vw)return;
  Z=Math.min(1,vw*.86/w);if(vw<720)Z=Math.max(Z,.42);
  X=(vw-w*Z)/2;Y=20;place();
}
const mid=()=>[vp.clientWidth/2,vp.clientHeight/2];
$('#zi').onclick=()=>{touched=true;zoomAt(1.25,...mid())};$('#zo').onclick=()=>{touched=true;zoomAt(.8,...mid())};$('#zf').onclick=()=>{touched=false;fit()};
vp.addEventListener('wheel',e=>{
  e.preventDefault();touched=true;const r=vp.getBoundingClientRect(),k=e.deltaMode===1?16:e.deltaMode===2?vp.clientHeight:1,dx=e.deltaX*k,dy=e.deltaY*k;
  if(e.ctrlKey||e.metaKey)zoomAt(Math.exp(-Math.max(-100,Math.min(100,dy))*.0018),e.clientX-r.left,e.clientY-r.top);
  else{X-=dx;Y-=dy;place()}
},{passive:false});
vp.addEventListener('scroll',()=>{vp.scrollLeft=0;vp.scrollTop=0});
const ptr=new Map();let drag=null,pinch=null,moved=false;
const rel=e=>{const r=vp.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
const pst=()=>{const[a,b]=[...ptr.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,x:(a.x+b.x)/2,y:(a.y+b.y)/2}};
vp.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.target.closest('.ficha,a'))return;
  ptr.set(e.pointerId,rel(e));moved=false;
  if(ptr.size===1){const p=ptr.get(e.pointerId);drag={x:p.x,y:p.y,X,Y}}
  else if(ptr.size===2){const s=pst();drag=null;moved=true;touched=true;pinch={d:s.d,Z,wx:(s.x-X)/Z,wy:(s.y-Y)/Z}}
});
vp.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;
  const p=rel(e);ptr.set(e.pointerId,p);
  if(ptr.size===2&&pinch){const s=pst();Z=Math.min(2.5,Math.max(.2,pinch.Z*s.d/pinch.d));X=s.x-pinch.wx*Z;Y=s.y-pinch.wy*Z;place()}
  else if(drag&&ptr.size===1){
    const dx=p.x-drag.x,dy=p.y-drag.y;
    if(!moved){if(Math.hypot(dx,dy)<5)return;moved=true;touched=true;vp.setPointerCapture(e.pointerId);vp.classList.add('grab')}
    X=drag.X+dx;Y=drag.Y+dy;place();
  }
});

  ptr.delete(e.pointerId);pinch=null;
  if(ptr.size===1){const p=[...ptr.values()][0];drag={x:p.x,y:p.y,X,Y}}
  else if(!ptr.size){drag=null;vp.classList.remove('grab')}
};
vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
vp.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);

/* menú flotante: Procesos / Niveles */
function swap(v,keep){
  view=v;$('#view-p').hidden=v!=='p';$('#view-n').hidden=v!=='n';stage.dataset.v=v;$('#sub').textContent=SUBT[v];
  $$('.seg').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
  if(!keep)fit();redraw();
}
const RM=matchMedia('(prefers-reduced-motion:reduce)'),DUR=820,EASE='cubic-bezier(.65,0,.25,1)';
function snap(){
  const S=stage.getBoundingClientRect(),o={leaf:new Map(),proc:[],head:[],oval:new Map()};
  const R=e=>{const r=e.getBoundingClientRect();return{x:(r.left-S.left)/Z,y:(r.top-S.top)/Z,w:r.width/Z,h:r.height/Z}};
  const vis=e=>e.getClientRects().length>0;
  $$('.leaf').forEach(l=>{if(vis(l))o.leaf.set(l.dataset.k,{e:l,r:R(l)})});
  $$(view==='p'?'.pnode':'.mx-r').forEach(e=>o.proc.push({e,r:R(e)}));
  $$('.mx-h').forEach(e=>{if(vis(e))o.head.push({e,r:R(e)})});
  $$('.oval').forEach(e=>{if(vis(e))o.oval.set(e.dataset.pi+':'+e.dataset.si,{e,r:R(e)})});
  return o;
}
function morph(v){
  if(busy||v===view)return;
  if(RM.matches){swap(v,true);return}
  busy=true;setTimeout(()=>{busy=false},3500);svg.style.opacity=0;
  $$('details[open]',stage).forEach(d=>d.open=false);
  const A=snap();swap(v,true);const B=snap();
  const layer=el('div','ghosts');layer.setAttribute('aria-hidden','true');board.append(layer);let ended=false;const done=()=>{if(ended)return;ended=true;layer.remove();stage.classList.remove('ghosting');busy=false;redraw();requestAnimationFrame(()=>{svg.style.opacity=1})};setTimeout(done,DUR+900);
  stage.classList.add('ghosting');
  const fin=[],C=r=>[r.x+r.w/2,r.y+r.h/2],T=a=>'translate('+a[0]+'px,'+a[1]+'px) scale('+a[2]+')';
  const put=(src,r)=>{const g=src.cloneNode(true);g.removeAttribute('id');$$('[id]',g).forEach(n=>n.removeAttribute('id'));g.hidden=false;
    g.style.cssText='left:'+r.x+'px;top:'+r.y+'px;width:'+r.w+'px;height:'+r.h+'px';layer.append(g);return g};
  const go=(g,a,b,d)=>fin.push(g.animate([{transform:T(a),opacity:a[3]},{transform:T(b),opacity:b[3]}],{duration:DUR,delay:d,easing:EASE,fill:'both'}).finished);
  const base=k=>k.split(':')[0]+':0';
  let n=0;
  B.leaf.forEach((b,k)=>{
    const exact=A.leaf.get(k),a=exact||A.leaf.get(base(k)),g=put(b.e,b.r),d=Math.min(n++*3,240),[bx,by]=C(b.r);
    if(a){const [ax,ay]=C(a.r);go(g,[ax-bx,ay-by,1,exact?1:0],[0,0,1,1],d)}
    else{const o=A.oval.get(b.e.dataset.pi+':'+b.e.dataset.si);
      if(o){const [ox,oy]=C(o.r);go(g,[ox-bx,oy-by,.25,0],[0,0,1,1],d)}else go(g,[0,0,.7,0],[0,0,1,1],d)}
  });
  A.leaf.forEach((a,k)=>{
    if(B.leaf.has(k))return;
    const t=B.leaf.get(base(k))||B.oval.get(a.e.dataset.pi+':'+a.e.dataset.si),g=put(a.e,a.r);
    if(t){const [ax,ay]=C(a.r),[tx,ty]=C(t.r);go(g,[0,0,1,1],[tx-ax,ty-ay,t.e.classList.contains('leaf')?1:.25,0],0)}
    else go(g,[0,0,1,1],[0,0,.8,0],0);
  });
  A.proc.forEach((a,i)=>{
    const b=B.proc[i];if(!b)return;
    const [ax,ay]=C(a.r),[bx,by]=C(b.r);
    go(put(a.e,a.r),[0,0,1,1],[bx-ax,by-ay,1,0],0);go(put(b.e,b.r),[ax-bx,ay-by,1,0],[0,0,1,1],0);
  });
  if(v==='n'){
    A.oval.forEach(a=>go(put(a.e,a.r),[0,0,1,1],[0,0,.6,0],0));
    B.head.forEach((b,i)=>go(put(b.e,b.r),[0,-26,.85,0],[0,0,1,1],220+i*70));
  }else{
    B.oval.forEach(b=>go(put(b.e,b.r),[0,0,.6,0],[0,0,1,1],260));
    A.head.forEach(a=>go(put(a.e,a.r),[0,0,1,1],[0,-26,.85,0],0));
  }
  Promise.allSettled(fin).then(done);
}
$$('.seg').forEach(b=>b.onclick=()=>morph(b.dataset.v));
addEventListener('resize',redraw);
if(window.ResizeObserver){new ResizeObserver(redraw).observe(stage);new ResizeObserver(()=>{if(!vp.clientWidth)return;if(touched)place();else fit();redraw()}).observe(vp)}

})();
